name: AWP Nightly Scenario Suite

on:
  schedule:
    # Run daily at 03:17 UTC (12:17 JST)
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  nightly-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run all unit tests
        run: python -m pytest tests/ -q --tb=short

      - name: Run smoke scenario suite
        run: python -m awp_rp_runtime_v2.testing.run_workflow_scenarios --suite smoke --verbose

      - name: Run integration scenario suite
        run: python -m awp_rp_runtime_v2.testing.run_workflow_scenarios --suite integration --verbose

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-artifacts
          path: artifacts/test-runs/
          retention-days: 7
