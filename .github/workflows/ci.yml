name: AWP RP Runtime V3 CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests/ -q --tb=short

      - name: Run workflow scenario smoke suite
        run: python -m awp_rp_runtime_v3.testing.run_workflow_scenarios --suite smoke --verbose

  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run contract tests
        run: python -m pytest tests/contract/ -q --tb=short

      - name: Run policy tests
        run: python -m pytest tests/policy/ -q --tb=short

      - name: Run storage tests
        run: python -m pytest tests/storage/ -q --tb=short

      - name: Run runtime tests
        run: python -m pytest tests/runtime/ -q --tb=short

      - name: Run integration tests
        run: python -m pytest tests/integration/ -q --tb=short
