[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "awp-novel-runtime-v3"
version = "0.2.0"
description = "Author-led novel writing runtime with embedded Pi agents"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "aiohttp>=3.9.0",
    "openai>=1.0.0",
    "anthropic>=0.25.0",
    "httpx>=0.25.0",
    "certifi>=2023.0.0",
]

[project.scripts]
awp-tui = "awp_rp_runtime_v3.scripts.awp_tui:main"

[tool.setuptools]
packages = [
    "awp_rp_runtime_v3",
    "awp_rp_runtime_v3.adapters",
    "awp_rp_runtime_v3.adapters.llm",
    "awp_rp_runtime_v3.contracts",
    "awp_rp_runtime_v3.runtime",
    "awp_rp_runtime_v3.scripts",
    "awp_rp_runtime_v3.storage",
    "awp_rp_runtime_v3.storage.sqlite",
]

[tool.setuptools.package-dir]
awp_rp_runtime_v3 = "."

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]
tui = [
    "textual>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
